  // Shuffled-queue approach instead of picking randomly each time — this
  // fixes the old bug where Math.random() could repeat the same variant
  // back-to-back or favor some variants over others in a session. Every
  // variant gets used exactly once before any repeats occur, in a freshly
  // randomized order each cycle.
  let shuffledQueue = [];

  function refillAndShuffleQueue() {
    shuffledQueue = [...variants];
    // Fisher–Yates shuffle
    for (let i = shuffledQueue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledQueue[i], shuffledQueue[j]] = [shuffledQueue[j], shuffledQueue[i]];
    }
  }

  function getNextVariant() {
    if (shuffledQueue.length === 0) {
      refillAndShuffleQueue();
    }
    return shuffledQueue.pop();
  }

  // Strips HTML tags (e.g. if you paste <b>bold</b> into a variant field)
  // since mailto plain-text bodies can't render them — prevents literal
  // "<b>" showing up in the sent email.
  function stripHtml(text) {
    return text.replace(/<[^>]+>/g, "");
  }

  function buildEmailBody(variant) {
    return [
      stripHtml(variant.opener),
      stripHtml(variant.body),
      stripHtml(variant.cta),
      stripHtml(variant.signOff),
    ].join("\n\n");
  }

  // Estimates the full mailto URL length for a variant using a realistic
  // placeholder recipient address. Real recipient emails vary slightly in
  // length, but this catches any variant that's oversized regardless of
  // who it's sent to.
  function estimateMailtoLength(variant) {
    const placeholderEmail = "someone.recipient@example.com";
    const subject = encodeURIComponent(variant.subject);
    const body = encodeURIComponent(buildEmailBody(variant));
    const url = `mailto:${placeholderEmail}?subject=${subject}&body=${body}`;
    return url.length;
  }

  // Checks EVERY variant against SAFE_URL_LENGTH before anything else runs.
  // If any are oversized, shows exactly which ones (by number, subject
  // preview, and character count) and disables both buttons entirely —
  // no silent skipping, no guessing which variants are quietly unusable.
  function validateVariants() {
    const oversized = [];
    variants.forEach((variant, index) => {
      const length = estimateMailtoLength(variant);
      if (length > SAFE_URL_LENGTH) {
        oversized.push({ index: index + 1, subject: variant.subject, length });
      }
    });

    if (oversized.length > 0) {
      const items = oversized
        .map(
          (v) =>
            `<li>Variant #${v.index} — "${v.subject}" (${v.length} chars, limit ${SAFE_URL_LENGTH})</li>`
        )
        .join("");
      variantErrorBox.innerHTML = `
        <h3>⚠️ ${oversized.length} variant(s) too long to send safely</h3>
        <p>These variants exceed the safe mailto link length and would fail or truncate silently in some mail clients. Shorten or remove them, then reload this page.</p>
        <ul>${items}</ul>
      `;
      variantErrorBox.style.display = "block";
      loadEmailsBtn.disabled = true;
      sendNextBtn.disabled = true;
      return false;
    }

    variantErrorBox.style.display = "none";
    variantErrorBox.innerHTML = "";
    loadEmailsBtn.disabled = false;
    return true;
  }

  function loadEmailsFromStorage() {
    const savedEmails = JSON.parse(localStorage.getItem("emails") || "[]");
    emailsInput.value = savedEmails.join("\n");
    updateSendNextButton();
  }

  function saveEmailsToStorage(emails) {
    localStorage.setItem("emails", JSON.stringify(emails));
  }

  function getEmails() {
    return emailsInput.value
      .split(/\r?\n/)
      .map(e => e.trim())
      .filter(e => e.length > 0);
  }

  function updateSendNextButton() {
    const emails = getEmails();
    sendNextBtn.disabled = emails.length === 0;
    if (emails.length === 0) {
      emailLink.style.display = "none";
      emailLink.href = "#";
      emailLink.textContent = "";
    }
  }

  function encodeMailto(email) {
    const variant = getNextVariant();
    const subject = encodeURIComponent(variant.subject);
    const body = encodeURIComponent(buildEmailBody(variant));
    return `mailto:${email}?subject=${subject}&body=${body}`;
  }

  loadEmailsBtn.addEventListener("click", () => {
    const emails = getEmails();
    if (emails.length === 0) {
      alert("Please paste at least one email.");
      return;
    }
    saveEmailsToStorage(emails);
    updateSendNextButton();
    alert(`Loaded ${emails.length} emails.`);
  });

  sendNextBtn.addEventListener("click", () => {
    let emails = getEmails();
    if (emails.length === 0) {
      alert("No emails to send.");
      return;
    }
    const currentEmail = emails.shift();
    emailsInput.value = emails.join("\n");
    saveEmailsToStorage(emails);
    updateSendNextButton();

    const mailtoLink = encodeMailto(currentEmail);
    emailLink.href = mailtoLink;
    emailLink.textContent = `📧 Sending email to: ${currentEmail}`;
    emailLink.style.display = "inline-block";
    emailLink.click();

    // Cooldown after click
    startCooldown(15);
  });

  function startCooldown(seconds) {
    sendNextBtn.disabled = true;
    let remaining = seconds;
    const originalText = "Send Next Email";
    sendNextBtn.textContent = `Wait ${remaining}s...`;
    const interval = setInterval(() => {
      remaining--;
      if (remaining > 0) {
        sendNextBtn.textContent = `Wait ${remaining}s...`;
      } else {
        clearInterval(interval);
        sendNextBtn.textContent = originalText;
        updateSendNextButton();
      }
    }, 1000);
  }

  window.addEventListener("load", () => {
    const variantsOk = validateVariants();
    if (variantsOk) {
      loadEmailsFromStorage();
    }
  });
</script>
</body>
</html>
